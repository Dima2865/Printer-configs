# Neptune 3 pro + btt pi v1.2

[gcode_macro PRINT_START]
gcode:
    G90 ; use absolute coordinates
    M220 S100 ;Reset Feedrate
    M221 S100 ;Reset Flowrate
    M104 S{first_layer_temperature[0]-70} ; set temporary nozzle temp to prevent oozing

    status_homing
    G28; home all axis
    G1 Z50 F1000
    M140 S{first_layer_bed_temperature[0]} ; start to heat bed
    G1 X2 Y10 F3000 ; move to left corner
    
    M190 S[first_layer_bed_temperature] ; wait for bed temp to stabilize
    G28 ; home all axis again after heating

    status_meshing
    BED_MESH_CALIBRATE
    BED_MESH_PROFILE LOAD=default ; load mesh
    
    SMART_PARK

    status_heating
    M104 S[first_layer_temperature] ; set final nozzle temp
    M109 S{first_layer_temperature[0]} ; wait for nozzle temp to stabilize

    status_cleaning
    LINE_PURGE
    
    G92 E0 ;Reset Extruder

    status_printing


[gcode_macro PRINT_END]
gcode:
    G91 ;Relative positionning
    G1 E-2 F2700 ;Retract a bit
    G1 E-8 X5 Y5 Z3 F3000 ;Retract
    G1 Z10 F240
    G90 ;Absolute positionning
    G1 X0 Y{print_bed_max[1]*0.9} F{travel_speed*60} ;Present print
    M106 S0 ;Turn-off fan
    M104 S0 ;Turn-off hotend
    M140 S0 ;Turn-off bed
    M84 ;Disable all steppers

    status_off


[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    G91 ;Relative positionning
    G1 E-2 F2700 ;Retract a bit
    G1 E-8 X5 Y5 Z3 F3000 ;Retract
    G1 Z10 F240
    G90 ;Absolute positionning
    # G1 X0 Y{print_bed_max[1]*0.9} F{travel_speed*60} ;Present print
    M106 S0 ;Turn-off fan
    # M104 S0 ;Turn-off hotend
    # M140 S0 ;Turn-off bed
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE
    M84 ;Disable all steppers

    status_off


[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
# change this if you need more or less extrusion
variable_extrude: 1.0
gcode:
    status_busy
    ##### read E from pause macro #####
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    ##### set park positon for x and y #####
    # default is your max posion from your printer.cfg
    {% set x_park = printer.toolhead.axis_maximum.x|float - 20.0 %}
    {% set y_park = printer.toolhead.axis_maximum.y|float - 20.0 %}
    ##### calculate save lift position #####
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - 2.0) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    ##### end of definitions #####
    PAUSE_BASE
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-{E} F2100
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
    {% if "xyz" in printer.toolhead.homed_axes %}
      G1 Z{z_safe} F900
      G90
      G1 X{x_park} Y{y_park} F6000
    {% else %}
      {action_respond_info("Printer not homed")}
    {% endif %} 


[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
    status_printing
    ##### read E from pause macro #####
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    #### get VELOCITY parameter if specified ####
    {% if 'VELOCITY' in params|upper %}
      {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
    {%else %}
      {% set get_params = "" %}
    {% endif %}
    ##### end of definitions #####
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G91
      G1 E{E} F2100
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}  
    RESUME_BASE {get_params}


[gcode_macro M420]
description: Load the current mesh
gcode:
  BED_MESH_PROFILE LOAD=default


[gcode_macro M900]
description: Set Pressure Advance
gcode:
  {% if 'K' in params %}
    {% if 'E' in params %}
      SET_PRESSURE_ADVANCE EXTRUDER={params.E} ADVANCE={params.K}
    {% else %}
      SET_PRESSURE_ADVANCE ADVANCE={params.K}
    {% endif %}
  {% endif %}


[gcode_macro G29]
description: creates automated homing and bed mesh
gcode:
  G28
  BED_MESH_CALIBRATE
  #DATA_SAVE


[gcode_macro LOAD_FILAMENT]
description: Загрузка филамента (по умолч. T=220°C, L=100 мм, F=3 мм/с)
gcode:
    # Параметры со значениями по умолчанию
    {% set temp = params.TEMP|default(220)|int %}
    {% set length = params.LENGTH|default(100)|int %}
    {% set feedrate_mm_s = params.FEEDRATE|default(3)|float %}
    {% set feedrate = (feedrate_mm_s * 60) | int %}

    # Включаем относительный режим экструзии для точной подачи
    M83

    # Нагрев экструдера и ожидание
    M104 S{temp}
    M109 S{temp}

    # Отключаем вентилятор обдува детали
    M107

    # Подача филамента
    G1 E{length} F{feedrate}

    # Пауза 2 секунды
    G4 P2000

    # Возвращаем абсолютный режим экструзии (стандарт для печати)
    M82

    # Отключаем нагрев
    M104 S0

    # Сообщение на дисплей
    M117 Загружено {length} мм при {temp}°C


[gcode_macro UNLOAD_FILAMENT]
description: Выгрузка филамента (по умолч. T=175°C, L=100 мм, F=3 мм/с)
gcode:
    {% set temp = params.TEMP|default(175)|int %}
    {% set length = params.LENGTH|default(100)|int %}
    {% set feedrate_mm_s = params.FEEDRATE|default(3)|float %}
    {% set feedrate = (feedrate_mm_s * 60) | int %}

    M83
    M104 S{temp}
    M109 S{temp}
    M107
    G1 E-{length} F{feedrate}
    G4 P2000
    M82
    M104 S0
    M117 Выгружено {length} мм при {temp}°C
